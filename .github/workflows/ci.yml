name: CI

# Validate every push and PR: cross-build the three 10.9 Go binaries + the Sparkle updater on
# macos-26 and run the compat gate. No publishing here — releases happen only on
# <version>-mavericks.<rev> tags (see release.yml).
#
# This is also the check that gates Renovate: every dependency-bump PR runs this, and branch protection
# on main requires both jobs -- the cross-build and its run on a real 10.9 guest -- so a bump that
# breaks either never lands on main.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-build + compat gate (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # cmake resolves the version from the shipped tags; without them CI would
                           # label every build -mavericks.1 and hide what it is really building

      # Installs the shipyard pkg: shipyard-cmake/-ctest/-cpack land on PATH and SHIPYARD_SCRIPTS is
      # exported. find_package(MavericksShipyard) resolves inside shipyard-cmake's own prefix.
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # spec: mavergreen-conventions SKILL.md "Build OUT of the source tree, onto fast local
      #       storage" -- exporting MAVERICKS_BUILD_ROOT does not win against the shared preset's own
      #       environment block, which derives it from TMPDIR; redirect TMPDIR instead.
      - name: Build out of tree
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # The ingredient pin list is derived from repackage-on-ingredient-bump.yml's own paths, so the
      # repackage trigger and the release notes can't drift -- but a glob that matches nothing would
      # silently mean no repackage and thinner notes. Fail here instead.
      - name: Guard the ingredient pin declaration
        run: |
          . build/msc.sh
          sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      # The 10.9-correct Go toolchain (the golang-<line> cross .pkg; its go.env CC wrapper supplies
      # the 10.9 SDK + target flags + legacy shim + -Wl,-U allowances). Cross mode: the root CMakeLists
      # picks `go` from PATH.
      - name: Install patched Go (mavericks-golang cross toolchain)
        run: |
          # The pin is a FILE (components/golang/version) so a bump is a watchable path: Renovate
          # bumps it via the '# mavericks-golang' customManager in .github/renovate.json, and
          # repackage-on-ingredient-bump.yml sees that path change and dispatches a repackage.
          # Verified against golang's published SHA256SUMS.
          ver="$(cat components/golang/version)"
          gover="${ver%%-mavericks.*}"; rev="${ver#*-}"
          # The Go line (e.g. 1.27.2 -> 127: repo golang-127, product go127-cross) is derived from the pin,
          # so moving to the next line is the pin plus renovate.json's packageNameTemplate, nothing here.
          line="$(printf '%s' "$gover" | cut -d. -f1,2 | tr -d .)"
          base="https://github.com/Mavergreen/golang-${line}/releases/download/${ver}"
          sums="$RUNNER_TEMP/SHA256SUMS"
          curl -fL --retry 3 -o "$sums" "$base/SHA256SUMS"
          cand="golang-${gover}-cross-${rev}.pkg"
          hash="$(awk -v f="$cand" '$2==f {print $1}' "$sums")"
          [ -n "$hash" ] || { echo "::error::no $cand in golang-${line} ${ver} SHA256SUMS"; exit 1; }
          pkg="$RUNNER_TEMP/$cand"
          curl -fL --retry 3 -o "$pkg" "$base/$cand"
          printf '%s  %s\n' "$hash" "$pkg" | shasum -a 256 -c -
          sudo installer -pkg "$pkg" -target /
          echo "/usr/local/mavergreen/go${line}-cross/bin" >> "$GITHUB_PATH"
          echo "GO_LINE=$line" >> "$GITHUB_ENV"

      - name: Confirm the patched cross toolchain is on PATH
        run: |
          test "$(command -v go)" = "/usr/local/mavergreen/go${GO_LINE}-cross/bin/go"
          go version

      - name: Cache the MacOSX10.9 SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.sdk-cache
          key: macosx10.9-sdk-v1

      # cmake resolves the version from UPSTREAM_VERSION + the shipped tags, and UPSTREAM_VERSION is
      # derived from the pin rather than committed -- so derive it before anything configures.
      - name: Derive the upstream version from the pin
        run: sh build/derive-upstream-version.sh

      - name: Build + gate the three Go binaries (x86_64 / min-10.9 / no post-10.9 imports)
        env:
          MAVERICKS_SDK_CACHE: ${{ runner.temp }}/.sdk-cache
        run: |
          shipyard-cmake --preset cross
          shipyard-cmake --build --preset cross
          shipyard-ctest --preset cross
          echo "GOBIN_DIR=$MAVERICKS_BUILD_ROOT/$(basename "$PWD")-cross/gobin" >> "$GITHUB_ENV"

      - name: Keep the binaries for the 10.9 guest
        uses: actions/upload-artifact@v7
        with:
          name: gobin
          path: ${{ env.GOBIN_DIR }}
          if-no-files-found: error

      # Sparkle updater .app: built every run (catches updater breaks). It must NOT link any Tailscale
      # product (self-update circularity); its own binary is tailscale-updater, so skip line 1 of otool.
      - name: Build the Sparkle updater (must not link tailscale)
        run: |
          shipyard-cmake -S updater -B "$MAVERICKS_BUILD_ROOT/tailscale-updater" -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$MAVERICKS_BUILD_ROOT/tailscale-updater"
          BIN="$MAVERICKS_BUILD_ROOT/tailscale-updater/tailscale-updater.app/Contents/MacOS/tailscale-updater"
          otool -L "$BIN" | tee /tmp/o.txt
          if otool -L "$BIN" | tail -n +2 | grep -iq tailscale; then
            echo "::error::updater links a tailscale product (self-update circularity)"; exit 1; fi

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  # spec: tests/on-mavericks.sh -- the cross-built binaries run as root on a real 10.9.5 guest
  #       (Mavergreen/mavericks-vm): they load, hostinfo reports the OS version, tailscaled comes up on
  #       a utun and stops cleanly, and the exit-node tests select and deselect an exit node against
  #       that kernel's routing table. A skip (77) fails here: this job exists so that it runs. Pull
  #       requests and main only, so a Renovate push does not boot a second guest for its own PR. A
  #       fork's pull request gets no secrets, so cannot boot the guest: it skips this.
  on-mavericks:
    name: On Mac OS X 10.9 (mavericks-vm)
    needs: [build]
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gobin
          path: gobin
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          run: |
            chmod +x gobin/*
            status=0; sudo sh tests/on-mavericks.sh gobin || status=$?
            [ "$status" -eq 0 ] || { echo "tests/on-mavericks.sh exited $status (77 is a skip, a failure here)"; exit 1; }
