name: release

# Cross-build the three 10.9-compatible Go binaries (tailscaled + tailscale CLI + tailscale-systray) on
# Linux with go127-cross, build the Sparkle updater there with clang22, assemble the standalone archive
# and the .pkg derived from it through shipyard's stevedore seams, and run them on a real 10.9 guest.
# Every push to main and every PR builds and gates all of it; publishing happens only from three entry
# points, and this workflow is the ONLY place a version is decided:
#   - a <version>-mavericks.<rev> tag pushed by hand, or
#   - workflow_dispatch upstream_release=true: a NEW upstream, <pinned upstream>-mavericks.1,
#     forward-only. Dispatched by release-on-bump.yml when the tailscale source pin moves.
#   - workflow_dispatch local_release=true: a same-upstream -mavericks.(N+1) REPACKAGE. Dispatched by
#     repackage-on-ingredient-bump.yml when a build ingredient pin moves.
# Both dispatch paths cut and publish INLINE -- the tag is minted by the publish step. Nothing here
# ever commits to main: branch protection requires a status check that a fresh bot commit cannot
# have, so the old commit-VERSION-then-push-a-tag approach could not work (and a GITHUB_TOKEN-pushed
# tag triggers nothing anyway). A push, a PR or a plain dispatch builds and gates without publishing.
# All-or-nothing: the single `publish` job is the only writer to Releases and it `needs` package and
# on-target, so a build or guest failure never ships a partial release.

on:
  push:
    branches: [main]
    tags: ['*-mavericks.*']
  pull_request:
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut+publish a -mavericks.(N+1) repackage (same upstream, rebuilt with current ingredients)"
        type: boolean
        default: false
      upstream_release:
        description: "Cut+publish <pinned upstream>-mavericks.1 if the tailscale source pin moved forward"
        type: boolean
        default: false

permissions:
  contents: read

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only from a tag or a dispatch, but keeps the family's one shape: most of the
# family's product repos auto-cut on a push to main, and a rule that holds only in some of them is a
# rule nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a local_release repackage counts existing <upstream>-mavericks.* tags
          persist-credentials: false

      - name: Read the toolchain pins
        id: pins
        run: |
          echo "golang=$(tr -d '[:space:]' < components/golang/version)" >> "$GITHUB_OUTPUT"
          echo "clang22=$(tr -d '[:space:]' < components/clang22/version)" >> "$GITHUB_OUTPUT"

      # spec: shipyard .github/actions/install/action.yml `products` -- go127-cross at the golang pin and,
      #       first, what it requires (sdk109; clang22, named here at its own pin so the Go link and the
      #       compat guard's Mach-O readers are the clang22 this repo pins), at /usr/local/mavergreen
      - name: Install mavericks-shipyard and the golang-127 cross toolchain
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }} go127-cross@${{ steps.pins.outputs.golang }}

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # The ingredient pin list is derived from repackage-on-ingredient-bump.yml's own paths, so the
      # repackage trigger and the release notes can't drift -- but a glob that matches nothing would
      # silently mean no repackage and thinner notes. Fail here instead.
      - name: Guard the ingredient pin declaration
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      # Decides two things: what VER is, and whether this run publishes. release-notes.sh (in the
      # package job) works out new-upstream vs. repackage vs. packaging-only itself, from the tags
      # and the ingredient pins, so this step does not track a release "kind".
      #
      # THE SHIPPED STATE LIVES IN TAGS. Nothing here is committed back, so the version is derived,
      # never read from a committed file. Two derivations, both shared:
      #   build/derive-upstream-version.sh -> UPSTREAM_VERSION, from the pin's own VERSION.txt
      #   resolve-version.sh               -> <upstream>-mavericks.N, from that plus the shipped tags,
      #                                       written to VERSION as a build product so this job's cmake
      #                                       configure and the package job embed the same string.
      #   - a *-mavericks.* tag: VER = the tag; publish=true. Committed notes required.
      #   - workflow_dispatch(upstream_release=true): a NEW upstream -- VER = <pinned>-mavericks.1
      #     (auto mode gives N=1 because that upstream has no tags yet), forward-only against the
      #     newest shipped tag; publish=true. Dispatched by release-on-bump.yml.
      #   - workflow_dispatch(local_release=true): a REPACKAGE -- VER = <upstream>-mavericks.(N+1);
      #     publish=true. Dispatched by repackage-on-ingredient-bump.yml.
      #   - anything else (a push, a PR, a plain dispatch): the shipped N; publish=false.
      - name: Decide version + whether this run publishes
        id: ver
        env:
          UPSTREAM_RELEASE: ${{ inputs.upstream_release }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
        run: |
          UP="$(sh build/derive-upstream-version.sh)"

          # Newest upstream among the shipped tags -- the forward-only comparison point. Read from
          # tags, not from a file: a pin edit pointing at an older tag must be a no-op, not an
          # auto-published downgrade.
          SHIPPED_UP=""
          for t in $(git tag --list '*-mavericks.*'); do
            u="${t%%-mavericks.*}"
            if [ -z "$SHIPPED_UP" ]; then
              SHIPPED_UP="$u"
            else
              newest=$(printf '%s\n%s\n' "$SHIPPED_UP" "$u" | sort -V | tail -1)
              [ "$newest" = "$u" ] && SHIPPED_UP="$u"
            fi
          done
          echo "pin upstream: $UP    newest shipped upstream: ${SHIPPED_UP:-<none>}"

          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"
            if [ -z "$(ls "release-notes/$VER/changes" 2>/dev/null)" ]; then
              echo "::error::release-notes/$VER/changes/ holds no change sentence"; exit 1; fi
            PUBLISH=true
            printf '%s\n' "$VER" > VERSION
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "$UPSTREAM_RELEASE" = true ]; then
            ahead=yes
            if [ -n "$SHIPPED_UP" ]; then
              newest=$(printf '%s\n%s\n' "$SHIPPED_UP" "$UP" | sort -V | tail -1)
              { [ "$UP" = "$SHIPPED_UP" ] || [ "$newest" != "$UP" ]; } && ahead=no
            fi
            if [ "$ahead" = no ]; then
              echo "pin upstream $UP is not ahead of shipped $SHIPPED_UP -- no release (build + gate only)."
              VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh")"; PUBLISH=false
            else
              VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh")"; PUBLISH=true
            fi
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "$LOCAL_RELEASE" = true ]; then
            VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh" local)"
            PUBLISH=true
          else
            VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh")"
            PUBLISH=false
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUBLISH"

      - name: Cross-build the three Go binaries for 10.9 with the Linux-hosted go127-cross
        run: |
          shipyard-cmake --preset cross
          shipyard-cmake --build --preset cross

      - name: Locate the build
        run: echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      # ctest: the compat guard on each binary (x86_64 / min-10.9 / no post-10.9 imports, read with
      # clang22's Mach-O readers), the install hooks, and the upstream notes lookup.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" cross

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # One tarball, so the binaries' executable bits survive the artifact round-trip. It carries the
      # three product binaries and the two test binaries tests/on-mavericks.sh runs on the guest.
      - name: Hand the binaries to the package and on-target jobs, modes kept
        run: tar -cf "$RUNNER_TEMP/gobin.tar" -C "$BUILD" gobin

      - uses: actions/upload-artifact@v7
        with:
          name: gobin
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/gobin.tar

  package:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VER: ${{ needs.build.outputs.version }}
      PUBLISH: ${{ needs.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # generated notes diff ingredient pins against the previous release tag
          persist-credentials: false

      - name: Read the clang22 pin
        id: pins
        run: echo "clang22=$(tr -d '[:space:]' < components/clang22/version)" >> "$GITHUB_OUTPUT"

      - name: Install mavericks-shipyard and clang22
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }}

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "BUILD=$RUNNER_TEMP/tailscale" >> "$GITHUB_ENV"

      - name: Pin the version the build job resolved
        run: printf '%s\n' "$VER" > VERSION

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - uses: actions/download-artifact@v8
        with:
          name: gobin
          path: ${{ runner.temp }}

      - name: Unpack the built binaries
        run: mkdir -p "$BUILD" && tar -xf "$RUNNER_TEMP/gobin.tar" -C "$BUILD"

      - name: Build the Sparkle updater with clang22 (must not link tailscale)
        run: echo "UPDATER=$(sh build/build-updater.sh "$VER" "$BUILD/updater")" >> "$GITHUB_ENV"

      - name: Package the standalone archive and the .pkg derived from it
        run: |
          set -eu
          mkdir -p "$BUILD/in" "$BUILD/dist"
          # Wrap the systray binary into the menu-bar .app the package expects.
          sh cmake/make_app.sh "$BUILD/gobin/tailscale-systray" "$BUILD/in/Mavericks Tailscale.app" "$VER" "$GITHUB_WORKSPACE/Tailscale.icns"
          pkg="$(sh cmake/package_pkg.sh --out "$BUILD/dist/tailscale-$VER.pkg" --version "$VER" \
            --tailscaled "$BUILD/gobin/tailscaled" --tailscale "$BUILD/gobin/tailscale" \
            --systray-app "$BUILD/in/Mavericks Tailscale.app" --updater-app "$UPDATER" \
            --daemon-plist "$GITHUB_WORKSPACE/dist/dev.mavergreen.tailscaled.plist" \
            --systray-agent "$GITHUB_WORKSPACE/dist/dev.mavergreen.tailscale-systray.plist" \
            --dist "$GITHUB_WORKSPACE/dist")"
          [ -f "$pkg" ] || { echo "::error::package_pkg.sh did not print a pkg path: $pkg"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: The package yields exactly the built binaries
        run: sh tests/package-test.sh "$PKG" "$BUILD/gobin"

      # Generate the single notes file ONCE: the Sparkle appcast <description> and the GitHub Release
      # body are the same bytes, read twice (the signing step below, and publish-release.yml from the
      # uploaded artifact). The generator decides new-upstream vs. repackage vs. packaging-only, and
      # which ingredient pins moved, itself -- from the tags and repackage-on-ingredient-bump.yml's
      # own `paths:` list -- so nothing here says which kind of release this is.
      - name: Release notes
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product Tailscale --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"
          echo "=== RELEASE_NOTES.md ==="; cat "$BUILD/dist/RELEASE_NOTES.md"

      - name: clang22's Mach-O readers, for the steps that read the pkg
        run: |
          set -eu
          CL="$(sh build/fetch-clang22.sh)"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; echo "STRINGS=$CL/bin/llvm-strings"; } >> "$GITHUB_ENV"

      - name: The standalone archive needs nothing else from Mavergreen
        run: sh "$SHIPYARD_SCRIPTS/check-standalone-archive.sh" "$BUILD/dist/tailscale-$VER-macos-x86_64.tar.gz"

      - name: Unsigned stand-in feeds (never published)
        if: env.PUBLISH != 'true'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "$VER"

      # Sign the .pkg + render the signed appcast (auto-fetches the prebuilt ed25519-sign). The
      # enclosure points at the versioned release asset; the client /latest/ feed resolves to this
      # full release immediately, so Sparkle clients pick it up right away.
      - name: EdDSA-sign the .pkg + write tailscale.xml
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
        run: |
          set -eu
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product tailscale --feed-dir "$BUILD/dist" \
            --channel-title "Tailscale for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      # No SHA256SUMS here: publish-release.yml regenerates it over everything it attaches.
      # Conformance: the .pkg, the standalone archive, the appcast and the version must agree with each
      # other and with the family's schemes (the 10.9.5 floor among them).
      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      # Behavior gate: a client on the previous release must actually SEE this as an upgrade -- a
      # numeric sparkle:version that orders strictly after the last published one.
      - name: The feed is an upgrade on its line
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/tailscale.xml" --version "$VER"

      - name: The package job must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: tailscale-pkg
          if-no-files-found: error
          path: ${{ env.BUILD }}/dist/*

  # spec: tests/on-mavericks.sh -- the cross-built binaries run as root on a real 10.9.5 guest
  #       (Mavergreen/mavericks-vm): they load, hostinfo reports the OS version, tailscaled comes up on
  #       a utun and stops cleanly, and the exit-node tests select and deselect an exit node against
  #       that kernel's routing table; certstore signs and reads certificate chains. Then the run's own
  #       pkg installs, its manifest names this run's version and what it installed runs, and the
  #       standalone archive's binaries run from wherever it is unpacked. A skip (77) fails here: this
  #       job exists so that it runs. A fork's pull request gets no secrets, so cannot boot the guest:
  #       it skips this, and since a skipped job passes the required gate, a fork's PR is merged by a
  #       maintainer who has run it.
  on-target:
    needs: [build, package]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # mavericks-vm's shared image cache
    env:
      VER: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: gobin
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: tailscale-pkg
          path: dist
      - name: Bring the binaries into the workspace the guest gets
        run: tar -xf "$RUNNER_TEMP/gobin.tar" -C .
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          envs: 'VER'
          run: |
            set -eu
            sw_vers
            status=0; sudo sh tests/on-mavericks.sh gobin || status=$?
            [ "$status" -eq 0 ] || { echo "tests/on-mavericks.sh exited $status (77 is a skip, a failure here)"; exit 1; }
            sudo installer -pkg "dist/tailscale-$VER.pkg" -target /
            got="$(sed -n '/<key>version<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' /usr/local/mavergreen/tailscale/mavergreen.plist | sed -n 1p)"
            [ "$got" = "$VER" ] || { echo "FAIL: the installed tailscale manifest says '$got', this run built $VER"; exit 1; }
            /usr/local/mavergreen/tailscale/bin/tailscale version
            /usr/local/mavergreen/tailscale/sbin/tailscaled --version
            "/Applications/Mavericks Tailscale.app/Contents/MacOS/tailscale-systray" -h 2>&1 | grep -q -- '-socket'
            echo "ok   the pkg installs $VER and its binaries run"
            x="$(mktemp -d "/tmp/tailscale standalone.XXXXXX")"
            tar -xzf "dist/tailscale-$VER-macos-x86_64.tar.gz" -C "$x"
            "$x/tailscale-$VER/bin/tailscale" version
            "$x/tailscale-$VER/sbin/tailscaled" --version
            echo "ok   the standalone archive's binaries run from $x"

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  # needs build too, only so the `if:` below can read its outputs.
  scan:
    if: always() && (needs.build.outputs.publish == 'true')   # a build that fails after signing left logs too; scan them
    needs: [build, package]
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: tailscale-pkg
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # All-or-nothing publish: the ONLY writer to Releases, gated on package and the 10.9 guest. The
  # shared workflow regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the body
  # (failing if it is missing or empty), and mints the tag at this commit via tag_name +
  # target_commitish, which a dispatch-cut repackage needs since a GITHUB_TOKEN-pushed tag triggers
  # nothing.
  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, package, on-target, scan]
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: tailscale-pkg

  retry:
    needs: [build, publish]
    if: always() && needs.publish.result == 'failure'
    permissions:
      contents: read
      actions: write
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}

  required:
    name: required (release)
    if: always()
    needs: [build, package, on-target, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
