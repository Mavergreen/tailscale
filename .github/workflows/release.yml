name: release

# Cross-build the three 10.9-compatible Go binaries (tailscaled + tailscale CLI + tailscale-systray)
# and the Sparkle updater on macos-26, assemble + EdDSA-sign the product .pkg, render the signed
# appcast, and attach the .pkg + appcast to a GitHub Release. Every push/PR is validated by ci.yml;
# this workflow publishes from three entry points, and is the ONLY place a version is decided:
#   - a <version>-mavericks.<rev> tag pushed by hand, or
#   - workflow_dispatch upstream_release=true: a NEW upstream, <pinned upstream>-mavericks.1,
#     forward-only. Dispatched by release-on-bump.yml when the tailscale source pin moves.
#   - workflow_dispatch local_release=true: a same-upstream -mavericks.(N+1) REPACKAGE. Dispatched by
#     repackage-on-ingredient-bump.yml when a build ingredient pin moves.
# Both dispatch paths cut and publish INLINE -- the tag is minted by the publish step. Nothing here
# ever commits to main: branch protection requires a status check that a fresh bot commit cannot
# have, so the old commit-VERSION-then-push-a-tag approach could not work (and a GITHUB_TOKEN-pushed
# tag triggers nothing anyway). A plain dispatch builds and gates without publishing.
# All-or-nothing: the single `publish` job is the only writer to Releases and it `needs` package, so
# a build failure never ships a partial release.

on:
  push:
    tags: ['*-mavericks.*']
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut+publish a -mavericks.(N+1) repackage (same upstream, rebuilt with current ingredients)"
        type: boolean
        default: false
      upstream_release:
        description: "Cut+publish <pinned upstream>-mavericks.1 if the tailscale source pin moved forward"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only from a tag or a dispatch, but keeps the family's one shape: most of the
# family's product repos auto-cut on a push to main, and a rule that holds only in some of them is a
# rule nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    runs-on: macos-26
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a local_release repackage counts existing <upstream>-mavericks.* tags

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # spec: mavergreen-conventions SKILL.md "Build OUT of the source tree, onto fast local
      #       storage" -- exporting MAVERICKS_BUILD_ROOT does not win against the shared preset's own
      #       environment block, which derives it from TMPDIR; redirect TMPDIR instead.
      - name: Build out of tree
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"

      - name: Derive the cross build directory
        run: |
          echo "CROSS_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"
          echo "CROSS_LEGACY_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross-legacy" >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # Decides two things: what VER is, and whether this run publishes. release-notes.sh (in the
      # package job) works out new-upstream vs. repackage vs. packaging-only itself, from the tags
      # and the ingredient pins, so this step no longer needs to track a release "kind".
      #
      # THE SHIPPED STATE LIVES IN TAGS. Nothing here is committed back -- branch protection requires
      # a status check no fresh bot commit can have -- so the version is derived, never read from a
      # committed file. Two derivations, both shared:
      #   build/derive-upstream-version.sh -> UPSTREAM_VERSION, from the pin's own VERSION.txt
      #   resolve-version.sh               -> <upstream>-mavericks.N, from that plus the shipped tags,
      #                                       written to VERSION as a build product so this job's cmake
      #                                       configure and the updater bundle embed the same string.
      #   - a *-mavericks.* tag: VER = the tag; publish=yes. Committed notes required.
      #   - workflow_dispatch(upstream_release=true): a NEW upstream -- VER = <pinned>-mavericks.1
      #     (auto mode gives N=1 because that upstream has no tags yet), forward-only against the
      #     newest shipped tag; publish=yes. Dispatched by release-on-bump.yml.
      #   - workflow_dispatch(local_release=true): a REPACKAGE -- VER = <upstream>-mavericks.(N+1);
      #     publish=yes. Dispatched by repackage-on-ingredient-bump.yml.
      #   - anything else (plain dispatch): the shipped N; publish=no.
      - name: Decide version + whether this run publishes
        id: ver
        run: |
          UP="$(sh build/derive-upstream-version.sh)"

          # Newest upstream among the shipped tags -- the forward-only comparison point. Read from
          # tags, not from a file: a pin edit pointing at an older tag must be a no-op, not an
          # auto-published downgrade.
          SHIPPED_UP=""
          for t in $(git tag --list '*-mavericks.*'); do
            u="${t%%-mavericks.*}"
            if [ -z "$SHIPPED_UP" ]; then
              SHIPPED_UP="$u"
            else
              newest=$(printf '%s\n%s\n' "$SHIPPED_UP" "$u" | sort -V | tail -1)
              [ "$newest" = "$u" ] && SHIPPED_UP="$u"
            fi
          done
          echo "pin upstream: $UP    newest shipped upstream: ${SHIPPED_UP:-<none>}"

          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"
            if [ ! -s "release-notes/$VER.md" ]; then
              echo "::error::release-notes/$VER.md missing or empty"; exit 1; fi
            PUBLISH=true
            printf '%s\n' "$VER" > VERSION
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.upstream_release }}" = "true" ]; then
            ahead=yes
            if [ -n "$SHIPPED_UP" ]; then
              newest=$(printf '%s\n%s\n' "$SHIPPED_UP" "$UP" | sort -V | tail -1)
              { [ "$UP" = "$SHIPPED_UP" ] || [ "$newest" != "$UP" ]; } && ahead=no
            fi
            if [ "$ahead" = no ]; then
              echo "pin upstream $UP is not ahead of shipped $SHIPPED_UP -- no release (build + gate only)."
              VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh")"; PUBLISH=false
            else
              VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh")"; PUBLISH=true
            fi
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
            VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh" local)"
            PUBLISH=true
          else
            VER="$(sh "$SHIPYARD_SCRIPTS/resolve-version.sh")"
            PUBLISH=false
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUBLISH"

      - name: Install patched Go (mavericks-golang cross toolchain)
        run: |
          # Pin lives in components/golang/version (a watchable path -- see ci.yml's copy of this note
          # and repackage-on-ingredient-bump.yml). Verified against golang's published SHA256SUMS.
          ver="$(cat components/golang/version)"
          base="https://github.com/Mavergreen/golang/releases/download/${ver}"
          sums="$RUNNER_TEMP/SHA256SUMS"
          curl -fL --retry 3 -o "$sums" "$base/SHA256SUMS"
          # golang renamed its cross asset prefix go126- -> golang- at 1.26.5-mavericks.1; accept either.
          gover="${ver%%-mavericks.*}"; rev="${ver#*-}"; cand=""; hash=""
          for pref in golang go126; do
            c="${pref}-${gover}-cross-${rev}.pkg"
            s=$(awk -v f="$c" '$2==f' "$sums" || true)
            if [ -n "$s" ]; then cand="$c"; hash="${s%% *}"; break; fi
          done
          [ -n "$cand" ] || { echo "::error::no cross pkg for $ver in golang SHA256SUMS"; exit 1; }
          pkg="$RUNNER_TEMP/$cand"
          curl -fL --retry 3 -o "$pkg" "$base/$cand"
          printf '%s  %s\n' "$hash" "$pkg" | shasum -a 256 -c -
          sudo installer -pkg "$pkg" -target /
          echo "/usr/local/go126-cross/bin" >> "$GITHUB_PATH"

      - name: Confirm the patched cross toolchain is on PATH
        run: |
          test "$(command -v go)" = /usr/local/go126-cross/bin/go
          go version

      - name: Cache the MacOSX10.9 SDK + assembled SDK106
        uses: actions/cache@v6
        with:
          # runner.temp, not the workspace: this job ends in assert-tree-clean.sh, and a workspace
          # cache would dirty the tree it asserts on.
          path: |
            ${{ runner.temp }}/.sdk-cache
            ${{ runner.temp }}/.sdk106-cache
          key: macosx10.9-sdk-v2

      - name: Build + gate the three Go binaries (x86_64 / min-10.9 / no post-10.9 imports)
        env:
          MAVERICKS_SDK_CACHE: ${{ runner.temp }}/.sdk-cache
        run: |
          shipyard-cmake --preset cross
          shipyard-cmake --build --preset cross
          shipyard-ctest --preset cross

      - name: Build the Sparkle updater (must not link tailscale)
        run: |
          shipyard-cmake -S updater -B "$MAVERICKS_BUILD_ROOT/tailscale-updater" -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          shipyard-cmake --build "$MAVERICKS_BUILD_ROOT/tailscale-updater"
          BIN="$MAVERICKS_BUILD_ROOT/tailscale-updater/TailscaleUpdater.app/Contents/MacOS/TailscaleUpdater"
          otool -L "$BIN" | tee /tmp/o.txt
          if otool -L "$BIN" | tail -n +2 | grep -iq tailscale; then
            echo "::error::updater links a tailscale product (self-update circularity)"; exit 1; fi

      - name: Build + gate the 10.6-floor binaries
        env:
          MAVERICKS_SDK_CACHE: ${{ runner.temp }}/.sdk-cache
          MAVERICKS_SDK106_CACHE: ${{ runner.temp }}/.sdk106-cache
        run: |
          shipyard-cmake --preset cross-legacy
          shipyard-cmake --build --preset cross-legacy
          shipyard-ctest --preset cross-legacy

      - name: Build the 10.6 updater
        env:
          MAVERICKS_SDK_CACHE: ${{ runner.temp }}/.sdk-cache
          MAVERICKS_SDK106_CACHE: ${{ runner.temp }}/.sdk106-cache
          VER: ${{ steps.ver.outputs.version }}
        run: sh cmake/build_updater106.sh "$MAVERICKS_BUILD_ROOT/updater106" "$VER"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # Bundle the packaging inputs into ONE tarball so executable bits (the binaries, the updater .app's
      # Mach-Os) survive the artifact round-trip -- artifacts otherwise drop file modes.
      - name: Stage + upload packaging inputs
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p stage
          ls -l "$CROSS_BUILD_DIR/gobin" "$CROSS_LEGACY_BUILD_DIR/gobin"
          cp "$CROSS_BUILD_DIR/gobin/tailscaled"        stage/tailscaled
          cp "$CROSS_BUILD_DIR/gobin/tailscale"         stage/tailscale
          cp "$CROSS_BUILD_DIR/gobin/tailscale-systray" stage/tailscale-systray
          cp -R "$MAVERICKS_BUILD_ROOT/tailscale-updater/TailscaleUpdater.app" stage/TailscaleUpdater.app
          cp "$CROSS_LEGACY_BUILD_DIR/gobin/tailscaled"        stage/tailscaled-106
          cp "$CROSS_LEGACY_BUILD_DIR/gobin/tailscale"         stage/tailscale-106
          cp "$CROSS_LEGACY_BUILD_DIR/gobin/tailscale-systray" stage/tailscale-systray-106
          cp -R "$MAVERICKS_BUILD_ROOT/updater106/TailscaleUpdater106.app" stage/TailscaleUpdater106.app
          find stage -name '._*' -delete 2>/dev/null || true
          tar -C stage -czf packaging-inputs.tgz .
      - uses: actions/upload-artifact@v7
        with:
          name: packaging-inputs
          path: packaging-inputs.tgz

  # Assemble + sign the product .pkg and render the signed appcast. Runs on macos-26 for
  # pkgbuild/productbuild + the shared signer.
  package:
    if: needs.build-macos.outputs.publish == 'true'
    needs: [build-macos]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # generated notes diff ingredient pins against the previous release tag
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: packaging-inputs, path: dl }

      # Generate the single notes file ONCE: the Sparkle appcast <description> and the GitHub Release
      # body are the same bytes, read twice (this step below, and publish-release.yml from the
      # uploaded artifact). The generator decides new-upstream vs. repackage vs. packaging-only, and
      # which ingredient pins moved, itself -- from the tags and repackage-on-ingredient-bump.yml's
      # own `paths:` list -- so nothing here says which kind of release this is. This job's checkout
      # is fresh (a separate runner), so it does NOT see the VERSION mutation build-macos made for a
      # local_release repackage -- use the version build-macos decided.
      - name: Generate release notes
        env:
          VER: ${{ needs.build-macos.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "$VER" --version "$VER" \
            --product Tailscale --min-os 10.9.5 --out dist/RELEASE_NOTES.md
          echo "=== dist/RELEASE_NOTES.md ==="; cat dist/RELEASE_NOTES.md

      - name: Assemble + sign the .pkg, render the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
          VER: ${{ needs.build-macos.outputs.version }}
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          . build/msc.sh
          mkdir -p in dist
          tar -C in -xzf dl/packaging-inputs.tgz          # restores executable bits
          # Wrap the systray binary into the menu-bar .app the package expects.
          sh cmake/make_app.sh in/tailscale-systray "in/Mavericks Tailscale.app" "$VER" "$GITHUB_WORKSPACE/Tailscale.icns"
          PKG="dist/tailscale-$VER.pkg"

          # dist/ in the repo holds the LaunchDaemon/Agent plists + pre/postinstall scripts.
          sh cmake/package_pkg.sh --out "$PKG" --version "$VER" \
            --tailscaled in/tailscaled --tailscale in/tailscale \
            --systray-app "in/Mavericks Tailscale.app" --updater-app in/TailscaleUpdater.app \
            --daemon-plist "$GITHUB_WORKSPACE/dist/dev.mavergreen.tailscaled.plist" \
            --systray-agent "$GITHUB_WORKSPACE/dist/dev.mavergreen.tailscale-systray.plist" \
            --dist "$GITHUB_WORKSPACE/dist"

          # Verify the 10.9.5 floor on the CI-built .pkg before signing/publishing.
          W=$(mktemp -d); pkgutil --expand "$PKG" "$W/x"
          grep -q '<os-version min="10.9.5"/>' "$W/x/Distribution" \
            || { echo "::error::.pkg is missing the 10.9.5 install floor"; exit 1; }

          # Sign the .pkg + render the signed appcast (auto-fetches the prebuilt ed25519-sign). The
          # enclosure points at the versioned release asset; the client /latest/ feed resolves to this
          # full release immediately, so Sparkle clients pick it up right away.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Tailscale for Mavericks" \
            --version "$VER" --pkg-url "$URL" --min-os 10.9.5 \
            --notes-file dist/RELEASE_NOTES.md --pkg "$PKG" > dist/appcast.xml
          echo "=== appcast.xml ==="; cat dist/appcast.xml

          # 10.6-floor pkg: same version, different binaries + install floor.
          PKG106="dist/tailscale-$VER-macos10.6.pkg"
          sh cmake/make_app.sh in/tailscale-systray-106 "in/Mavericks Tailscale 106.app" "$VER" "$GITHUB_WORKSPACE/Tailscale.icns" 10.6
          sh cmake/package_pkg_legacy106.sh --out "$PKG106" --version "$VER" \
            --tailscaled in/tailscaled-106 --tailscale in/tailscale-106 \
            --systray-app "in/Mavericks Tailscale 106.app" \
            --updater-app in/TailscaleUpdater106.app \
            --daemon-plist "$GITHUB_WORKSPACE/dist/dev.mavergreen.tailscaled.plist" \
            --systray-agent "$GITHUB_WORKSPACE/dist/dev.mavergreen.tailscale-systray.plist" \
            --dist "$GITHUB_WORKSPACE/dist"

          # Serve a SEPARATE 10.6 appcast (not mixed into the Sparkle feed:
          # unsigned items confuse 10.9 Sparkle clients). The 10.6 updater
          # reads this file; the 10.9 Sparkle reads the original appcast.
          PKG106_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG106")"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">\n  <channel>\n    <title>Tailscale for Snow Leopard</title>\n    <item>\n      <title>Version %s</title>\n      <sparkle:version>%s</sparkle:version>\n      <sparkle:minimumSystemVersion>10.6</sparkle:minimumSystemVersion>\n      <enclosure url="%s" type="application/octet-stream" />\n    </item>\n  </channel>\n</rss>\n' \
            "$VER" "$VER" "$PKG106_URL" > dist/appcast-10.6.xml
      # No SHA256SUMS here: publish-release.yml regenerates it over everything it attaches, so the
      # checksums cover the appcast too and no repo hand-rolls that step.
      # Conformance: the .pkg, the appcast and the version we are about to publish must agree with each
      # other and with the family's schemes. Each piece is checked somewhere already; nothing asserted
      # they agree. This job only runs when publishing, so no extra gate is needed here.
      - name: Artifact conformance
        env:
          VER: ${{ needs.build-macos.outputs.version }}
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate: a client on the previous release must actually SEE this as an upgrade -- a
          # numeric sparkle:version that orders strictly after the last published one. The conformance
          # check above verifies artifacts AGREE; it never exercised update ordering, which is the gap
          # the "-mavericks.N compares EQUAL -> you're up to date" bug shipped straight through.
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/appcast.xml --version "$VER"

      - uses: actions/upload-artifact@v7
        with:
          name: tailscale-pkg
          path: |
            dist/*.pkg
            dist/appcast.xml
            dist/appcast-10.6.xml
            dist/RELEASE_NOTES.md

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  # needs build-macos too, only so the `if:` below can read its outputs.
  scan:
    if: always() && (needs.build-macos.outputs.publish == 'true')   # a build that fails after signing left logs too; scan them
    needs: [build-macos, package]
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: tailscale-pkg
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # All-or-nothing publish: the ONLY writer to Releases, gated on package. The shared workflow owns
  # the mechanics -- it regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the body
  # (failing if it is missing or empty), and mints the tag at this commit via tag_name +
  # target_commitish, which a dispatch-cut repackage needs since a GITHUB_TOKEN-pushed tag triggers
  # nothing. Six lines here instead of a bespoke publish job is the point: the wiring that decides
  # whether anyone ever reads the notes is no longer per-repo.
  publish:
    if: needs.build-macos.outputs.publish == 'true'
    needs: [build-macos, package, scan]
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build-macos.outputs.version }}
      artifact: tailscale-pkg
